services:
  - type: web
    name: watch-later-worker
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: node src/worker.js
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: POLL_INTERVAL_MS
        value: "2000"
