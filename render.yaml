services:
  - type: worker
    name: watch-later-worker
    env: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node src/worker.js
    autoDeploy: true
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: POLL_INTERVAL_MS
        value: "1000"
